<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dem Prologue</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #frame { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000; overflow: hidden; }
  canvas#gl { width: 100%; height: 100%; display: block; }
  #start { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #d8e6e0; cursor: pointer;
           background: radial-gradient(ellipse at 50% 60%, rgba(14,22,24,.88), rgba(0,0,0,.97)); z-index: 5; }
  #start h1 { font-weight: 300; letter-spacing: .5em; font-size: clamp(22px, 6vh, 44px); margin: 0 0 14px; padding-left: .5em; }
  #start p { margin: 6px 0; opacity: .65; font-size: clamp(11px, 1.8vh, 14px); letter-spacing: .16em; }
  #start .go { margin-top: 28px; padding: 12px 26px; border: 1px solid rgba(216,230,224,.6); display: inline-block; letter-spacing: .32em; font-size: clamp(11px, 1.8vh, 14px); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="gl"></canvas>
  <div id="start">
    <div>
      <h1>DEM</h1>
      <p>PROLOGUE &middot; 41 SECONDS</p>
      <p>SOUND ON</p>
      <div class="go" id="goTxt">TAP TO PLAY</div>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const DURATION = 41.4;
const frameEl = document.getElementById('frame'), canvas = document.getElementById('gl'), startEl = document.getElementById('start');
const clamp = THREE.MathUtils.clamp;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease3 = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const lerp = THREE.MathUtils.lerp;
// seeded layout so every load (and every render worker) builds the same world
const rng = (() => { let s = 20240611; return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();
const R = (a, b) => a + rng() * (b - a);
const noise1 = x => Math.sin(x * 1.3) * .5 + Math.sin(x * 2.7 + 1.3) * .3 + Math.sin(x * 5.9 + 4.1) * .2;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;

const world = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(62, 9 / 16, .02, 500); world.add(cam);

/* -------------------------------------------------------------- helpers */
function canvasTex(w, h, draw, repeat = [1, 1], srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); t.anisotropy = 8; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t;
}
function speckle(g, w, h, n, a) { for (let i = 0; i < n; i++) { g.fillStyle = `rgba(${rng() > .5 ? '255,255,255' : '0,0,0'},${rng() * a})`; g.fillRect(rng() * w, rng() * h, 1 + rng() * 2, 1 + rng() * 2); } }
const glowTex = canvasTex(128, 128, (g, w, h) => { const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(255,255,255,.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .8, ...o });
const basic = (color, o = {}) => new THREE.MeshBasicMaterial({ color, fog: false, ...o });
function mk(geo, mat, x = 0, y = 0, z = 0, parent) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); if (parent) parent.add(m); return m; }
function glow(color, size, x, y, z, parent, opacity = 1) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, transparent: true, opacity })); s.scale.set(size, size, 1); s.position.set(x, y, z); parent.add(s); return s; }
const pm = new THREE.PMREMGenerator(renderer);
const envTex = pm.fromScene(new RoomEnvironment(), .04).texture;

/* ------------------------------------------------------ the thing in the dark */
function makeWraith(strandN = 28) {
  const g = new THREE.Group(); const black = new THREE.MeshBasicMaterial({ color: 0x000000, fog: false, side: THREE.DoubleSide });
  const head = mk(new THREE.SphereGeometry(1, 20, 16), black, 0, 2.05, 0, g); head.scale.set(.15, .24, .16);
  mk(new THREE.CylinderGeometry(.035, .05, .3, 8), black, 0, 1.8, 0, g);
  mk(new THREE.CylinderGeometry(.16, .5, 1.75, 20, 1, true), black, 0, .9, 0, g);
  mk(new THREE.SphereGeometry(1, 16, 10), black, 0, 1.7, 0, g).scale.set(.3, .1, .14);
  for (const s of [-1, 1]) { const a = mk(new THREE.CylinderGeometry(.018, .028, 1.7, 8), black, s * .27, 1.0, .02, g); a.rotation.z = s * .09; }
  const strands = [];
  for (let i = 0; i < strandN; i++) {
    const geo = new THREE.PlaneGeometry(.018, 1.9, 1, 12); geo.translate(0, -.95, 0);
    const m = new THREE.Mesh(geo, black), ang = R(0, 6.28), r = R(.04, .15);
    m.position.set(Math.cos(ang) * r, 2.2, Math.sin(ang) * r * .8); m.rotation.y = R(0, 3.14); m.userData = { seed: R(0, 100), amp: R(.015, .06) }; g.add(m); strands.push(m);
  }
  const eyes = [-1, 1].map(s => { const e = mk(new THREE.CircleGeometry(.014, 14), new THREE.MeshBasicMaterial({ color: 0xff2410, toneMapped: false, fog: false, transparent: true }), s * .06, 2.07, .166, g); e.userData.gl = glow(0xff2200, .16, s * .06, 2.07, .18, g, .8); return e; });
  g.userData = { strands, eyes };
  g.userData.tick = t => { strands.forEach(m => { const p = m.geometry.attributes.position, u = m.userData; for (let i = 0; i < p.count; i++) { const k = Math.floor(i / 2) / 12; p.setX(i, (i % 2 ? .009 : -.009) + Math.sin(t * 1.2 + u.seed + k * 4) * u.amp * k * k * 3.2); p.setZ(i, Math.cos(t * .9 + u.seed + k * 3) * u.amp * k * 2.2); } p.needsUpdate = true; }); };
  return g;
}
// closed-form dust burst: position and fade are pure functions of age, so scrubbing is exact
function makeBurst(n, color, size, spread, dur) {
  const geo = new THREE.BufferGeometry(), pos = new Float32Array(n * 3), p0 = new Float32Array(n * 3), v = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { p0[i * 3] = R(-.25, .25); p0[i * 3 + 1] = R(0, 2.1); p0[i * 3 + 2] = R(-.15, .15); const a = R(0, 6.28), u = R(-1, 1), s = R(.3, 1) * spread; v[i * 3] = Math.cos(a) * Math.sqrt(1 - u * u) * s; v[i * 3 + 1] = u * s * .7 + R(0, .8); v[i * 3 + 2] = Math.sin(a) * Math.sqrt(1 - u * u) * s; }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ map: glowTex, size, color, transparent: true, depthWrite: false, fog: false, opacity: 0 })); pts.frustumCulled = false;
  return { pts, n, set(age, origin, i0 = 0, i1 = n) { // i0..i1 = which particles use this age
    for (let i = i0; i < i1; i++) { const a = Math.max(age, 0), k = (1 - Math.exp(-2.4 * a)) / 2.4; pos[i * 3] = origin.x + p0[i * 3] + v[i * 3] * k; pos[i * 3 + 1] = origin.y + p0[i * 3 + 1] + v[i * 3 + 1] * k - 1.6 * a * a; pos[i * 3 + 2] = origin.z + p0[i * 3 + 2] + v[i * 3 + 2] * k; }
    geo.attributes.position.needsUpdate = true; }, show(op) { pts.material.opacity = op; } };
}
function bGeo(w, h, d) {
  const geo = new THREE.BoxGeometry(w, h, d), uv = geo.attributes.uv, sc = [d, h, d, h, 0, 0, 0, 0, w, h, w, h];
  for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) { const k = f * 4 + i; if (f === 2 || f === 3) uv.setXY(k, uv.getX(k) * .1, uv.getY(k) * .1); else uv.setXY(k, uv.getX(k) * sc[f * 2] / 16, uv.getY(k) * sc[f * 2 + 1] / 56); }
  return geo;
}

/* ====================================================================== ENVIRONMENTS
   each: { g, fog, bg, update(lt, lost) } — camera, hand and scene are all pure functions of local time */
function corridorMats() {
  const wallT = canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#343a33'; c.fillRect(0, 0, w, h); for (let x = 0; x < w; x += 32) { c.fillStyle = 'rgba(255,255,255,.04)'; c.fillRect(x, 0, 16, h); } for (let i = 0; i < 6; i++) { const gr = c.createLinearGradient(0, 0, 0, h * R(.3, .9)); gr.addColorStop(0, 'rgba(8,5,2,.5)'); gr.addColorStop(1, 'rgba(8,5,2,0)'); c.fillStyle = gr; c.fillRect(R(0, w), 0, R(6, 30), h); } speckle(c, w, h, 2500, .22); }, [5, 1.3]);
  const floorT = canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#251b13'; c.fillRect(0, 0, w, h); const pw = w / 5; for (let i = 0; i < 5; i++) { const s = R(.7, 1.25); c.fillStyle = `rgb(${38 * s | 0},${27 * s | 0},${18 * s | 0})`; c.fillRect(i * pw, 0, pw, h); c.fillStyle = 'rgba(0,0,0,.85)'; c.fillRect(i * pw, 0, 2, h); } speckle(c, w, h, 2500, .2); }, [1.2, 6]);
  const wm = std(0xffffff, { map: wallT, roughness: .92 }), fm = std(0xffffff, { map: floorT, roughness: .38 });
  return { wm, fm };
}

const envs = {};

// ---- the door (opening beat): walk down a flat's hallway, the latch turns on its own, light pours out
envs.door = (() => {
  const g = new THREE.Group();
  const { wm, fm } = corridorMats();
  const dark = std(0x0c0b0a, { roughness: .85 });
  mk(new THREE.PlaneGeometry(12, 2.6), wm, -1.1, 1.3, -2, g).rotation.y = Math.PI / 2; mk(new THREE.PlaneGeometry(12, 2.6), wm, 1.1, 1.3, -2, g).rotation.y = -Math.PI / 2;
  mk(new THREE.PlaneGeometry(2.2, 12), fm, 0, 0, -2, g).rotation.x = -Math.PI / 2; mk(new THREE.PlaneGeometry(2.2, 12), std(0x14161a), 0, 2.6, -2, g).rotation.x = Math.PI / 2;
  mk(new THREE.PlaneGeometry(2.2, 2.6), wm, 0, 1.3, 4, g).rotation.y = Math.PI;
  // end wall with a real opening
  mk(new THREE.PlaneGeometry(.6, 2.6), wm, -.8, 1.3, -8, g); mk(new THREE.PlaneGeometry(.6, 2.6), wm, .8, 1.3, -8, g); mk(new THREE.PlaneGeometry(1, .6), wm, 0, 2.3, -8, g);
  [[-.54, 1.05, .08, 2.1], [.54, 1.05, .08, 2.1]].forEach(([x, y, w, h]) => mk(new THREE.BoxGeometry(w, h, .14), dark, x, y, -8.02, g)); mk(new THREE.BoxGeometry(1.2, .08, .14), dark, 0, 2.14, -8.02, g);
  const light = basic(0xcfeeff, { toneMapped: false });
  mk(new THREE.PlaneGeometry(7, 5), light, 0, 2, -9.8, g);
  const panel = canvasTex(256, 512, (c, w, h) => { c.fillStyle = '#23201c'; c.fillRect(0, 0, w, h); c.strokeStyle = 'rgba(0,0,0,.65)'; c.lineWidth = 6; c.strokeRect(24, 24, w - 48, 190); c.strokeRect(24, 250, w - 48, 236); for (let i = 0; i < 120; i++) { c.strokeStyle = `rgba(0,0,0,${R(.05, .3)})`; c.lineWidth = R(.5, 1.5); const x = R(0, w); c.beginPath(); c.moveTo(x, 0); c.lineTo(x + R(-3, 3), h); c.stroke(); } speckle(c, w, h, 2200, .22); });
  const leafP = new THREE.Group(); leafP.position.set(-.5, 0, -7.98); g.add(leafP);
  mk(new THREE.BoxGeometry(1, 2.0, .05), std(0xffffff, { map: panel, roughness: .6 }), .5, 1.1, 0, leafP);
  const knob = mk(new THREE.SphereGeometry(.035, 16, 12), std(0x6a5f4c, { metalness: .9, roughness: .3, envMap: envTex }), .88, 1.0, .05, leafP);
  mk(new THREE.PlaneGeometry(.98, .1), basic(0xcfeeff, { toneMapped: false }), 0, .05, -8.15, g);
  // things people leave in a hallway
  for (let i = 0; i < 4; i++) mk(new RoundedBoxGeometry(.34, R(.7, .95), .14, 3, .04), std([0x1b1f26, 0x2a2420, 0x20262c, 0x141414][i], { roughness: .95 }), -1.0, 1.35, 1.6 - i * .34, g).rotation.y = Math.PI / 2;
  mk(new THREE.BoxGeometry(.04, .04, 1.5), std(0x2a2a2a, { metalness: .6 }), -1.07, 1.85, .95, g);
  for (let i = 0; i < 3; i++) { const sh = mk(new RoundedBoxGeometry(.3, .1, .12, 3, .03), std(0x14110e), .85, .05, -.5 - i * .3, g); sh.rotation.y = R(-.5, .5); }
  mk(new THREE.BoxGeometry(.5, .01, .8), std(0x1a2a24, { roughness: 1 }), 0, .006, -6.9, g);
  [[1.08, 1.6, -1.5, -1], [1.08, 1.55, -4.2, -1], [-1.08, 1.6, -4.6, 1]].forEach(([x, y, z, sd]) => { const f = mk(new THREE.BoxGeometry(.3, .4, .03), dark, x, y, z, g); f.rotation.y = sd * Math.PI / 2; });
  g.add(new THREE.HemisphereLight(0x4a6074, 0x0a0806, .5));
  const bulb = new THREE.PointLight(0xffd9a8, 12, 14, 1.4); bulb.position.set(0, 1.9, -1); g.add(bulb);
  const doorLight = new THREE.PointLight(0xbfe4ff, 0, 40, 1.2); doorLight.position.set(0, 1.4, -8.6); g.add(doorLight);
  const shaft = glow(0xbfe8ff, 9, 0, 1.4, -8.5, g, 0);
  return { g, fog: [0x050709, .05], bg: 0x020304, update(lt) {
    const walk = smooth(0, 3.5, lt), z = 3.3 - 8.6 * walk - .6 * smooth(4, 6.4, lt), bob = Math.sin(lt * 5.6) * .03 * (1 - smooth(3.2, 3.6, lt));
    knob.rotation.z = -.8 * smooth(3.6, 3.75, lt) * (1 - smooth(3.95, 4.0, lt));
    leafP.rotation.y = 1.55 * ease3((lt - 4.0) / 1.8);
    doorLight.intensity = 150 * smooth(4.1, 6.2, lt); shaft.material.opacity = .55 * smooth(4.2, 6.4, lt);
    bulb.intensity = 12 * (.92 + .08 * noise1(lt * 17)) * (1 - .35 * smooth(4, 6, lt));
    cam.fov = 62; cam.position.set(noise1(lt * 2) * .01, 1.62 + bob, z); cam.rotation.set(.01 + .05 * smooth(4, 6, lt) + noise1(lt * 7) * .002, 0, Math.sin(lt * 2.8) * .004); cam.updateProjectionMatrix();
  } };
})();

// ---- city that folds
envs.city = (() => {
  const g = new THREE.Group(), near = new THREE.Group(), far = new THREE.Group(); far.position.set(0, 0, -30); g.add(near, far);
  const win = canvasTex(128, 256, (c, w, h) => { c.fillStyle = '#050b12'; c.fillRect(0, 0, w, h); const cols = ['#7fe8ff', '#ffd27a', '#ff7ad9', '#a8ffdc']; for (let y = 0; y < 16; y++) for (let x = 0; x < 8; x++) if (rng() < .42) { c.fillStyle = cols[(rng() * 4) | 0]; c.fillRect(x * 16 + 3, y * 16 + 3, 10, 10); } });
  const bm = new THREE.MeshStandardMaterial({ color: 0x7088a0, map: win, emissive: 0xffffff, emissiveMap: win, emissiveIntensity: 1.1, roughness: .85 });
  const gm = std(0x05080c, { roughness: .45, metalness: .1 });
  mk(new THREE.PlaneGeometry(40, 40), gm, 0, 0, -10, near).rotation.x = -Math.PI / 2;
  mk(new THREE.PlaneGeometry(40, 100), gm, 0, 0, -50, far).rotation.x = -Math.PI / 2;
  const lineM = basic(0xffc86a);
  for (let z = 8; z > -120; z -= 4) { const p = z > -30 ? near : far, lz = z > -30 ? z : z + 30; mk(new THREE.BoxGeometry(.18, .01, 1.6), lineM, 0, .01, lz, p); }
  for (const side of [-1, 1]) for (let z = 8; z > -120;) {
    const w = R(6, 12), d = R(8, 16), h = R(14, 42) + (-z) * .32, p = z > -30 ? near : far, lz = (z > -30 ? z : z + 30) - d / 2;
    mk(bGeo(w, h, d), bm, side * (6.5 + w / 2 + R(0, 3)), h / 2, lz, p); z -= d + R(.5, 3);
  }
  for (const side of [-1, 1]) for (let z = 4; z > -60; z -= 9) { const p = z > -30 ? near : far; glow(0xffd9a0, 1.1, side * 5.4, 4.2, z > -30 ? z : z + 30, p, .55); }
  g.add(new THREE.HemisphereLight(0x3a6a90, 0x050608, .35));
  const moon = new THREE.DirectionalLight(0x7aa8ff, .7); moon.position.set(-6, 14, 4); g.add(moon);
  return { g, fog: [0x061520, .02], bg: 0x050d16, update(lt, lost) {
    let ang, prog;
    if (!lost) { prog = ease3((lt - .45) / 1.2); ang = prog * 1.75; }
    else { prog = smooth(.45, .75, lt) * (1 - smooth(.95, 1.15, lt)); ang = prog * .38 + noise1(lt * 20) * .05 * smooth(.4, 1, lt); }
    far.rotation.x = ang;
    cam.fov = 62; cam.position.set(noise1(lt * 3) * .02, 1.7, 6 - lt * 1.2); cam.rotation.set(.06 + .38 * prog + (lost ? noise1(lt * 30) * .01 * smooth(.4, 1.2, lt) : 0), 0, (lost ? noise1(lt * 17) * .03 * smooth(.3, 1.4, lt) : 0)); cam.updateProjectionMatrix();
        } };
})();

// ---- room where things float
envs.room = (() => {
  const g = new THREE.Group();
  const wallM = std(0x2a2622, { roughness: .95 }), woodM = std(0x2c1f16, { roughness: .5 });
  mk(new THREE.PlaneGeometry(9, 9), woodM, 0, 0, -1, g).rotation.x = -Math.PI / 2;
  mk(new THREE.PlaneGeometry(9, 4), wallM, 0, 2, -5.5, g);
  const lw = mk(new THREE.PlaneGeometry(9, 4), wallM, -4.5, 2, -1, g); lw.rotation.y = Math.PI / 2;
  const rw = mk(new THREE.PlaneGeometry(9, 4), wallM, 4.5, 2, -1, g); rw.rotation.y = -Math.PI / 2;
  mk(new THREE.PlaneGeometry(9, 9), std(0x181512), 0, 4, -1, g).rotation.x = Math.PI / 2;
  mk(new THREE.PlaneGeometry(1.6, 2.2), basic(0x8fb4e8, { toneMapped: false }), 0, 2.2, -5.45, g);
  const lamp = new THREE.PointLight(0xffb870, 14, 12, 1.6); lamp.position.set(2.4, 1.6, -2.8); g.add(lamp);
  const moon = new THREE.SpotLight(0x8fb4ff, 30, 14, .7, .6, 1.4); moon.position.set(0, 3, -5); moon.target.position.set(0, 0, -1); g.add(moon, moon.target);
  g.add(new THREE.HemisphereLight(0x4a5a78, 0x0a0806, .5));
  glow(0xffc27a, .9, 2.4, 1.6, -2.8, g, .9);
  const mats = [std(0x6b4a34), std(0x3d4a5a), std(0x8a3d32), std(0x4d5d3d), std(0x9a8a6a), std(0x2a2f38)];
  const items = [];
  const add = (geo, i, x, y, z) => { const m = mk(geo, mats[i % mats.length], x, y, z, g); items.push({ m, home: new THREE.Vector3(x, y, z), tgt: new THREE.Vector3(R(-2.4, 2.4), R(.9, 3.3), R(-4.2, -.8)), spin: new THREE.Vector3(R(-2, 2), R(-2, 2), R(-2, 2)), delay: R(0, .35), fall: R(0, .25) }); };
  add(new RoundedBoxGeometry(2.2, .5, .95, 3, .05), 0, -1.6, .25, -3.6); add(new RoundedBoxGeometry(2.2, .7, .22, 3, .05), 0, -1.6, .7, -4.0);
  add(new THREE.BoxGeometry(1.2, .06, .7), 4, 1.2, .62, -3.2); add(new THREE.BoxGeometry(.08, .6, .08), 5, .75, .3, -3.5); add(new THREE.BoxGeometry(.08, .6, .08), 5, 1.65, .3, -2.9);
  add(new RoundedBoxGeometry(.5, .5, .5, 3, .04), 1, .3, .25, -1.5); add(new RoundedBoxGeometry(.5, .9, .5, 3, .04), 2, -.4, .45, -1.9);
