  let peak = 0; for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(Rr[i])); const k = peak > .95 ? .95 / peak : 1;
  for (let i = 0; i < n; i++) { dv2.setInt16(44 + i * 4, clamp(L[i] * k, -1, 1) * 32767, true); dv2.setInt16(46 + i * 4, clamp(Rr[i] * k, -1, 1) * 32767, true); }
  let bin = ''; for (let i = 0; i < bytes.length; i += 32768) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
  return { b64: btoa(bin), peak };
}

/* ===================================================================== loop */
let manual = false, playing = false, ended = false, tClock = 0, lastNow = performance.now() / 1000;
function frame() {
  requestAnimationFrame(frame); if (manual) return;
  const now = performance.now() / 1000, dt = Math.min(now - lastNow, .05); lastNow = now;
  if (playing && !ended) { tClock += dt; if (tClock >= DURATION) { ended = true; playing = false; document.getElementById('goTxt').textContent = 'TAP TO REPLAY'; startEl.classList.remove('hidden'); } }
  const t0 = performance.now(); renderFrame(Math.min(tClock, DURATION - .01)); ema = lerp(ema, performance.now() - t0, .08);
  blurN = ema > 40 ? 1 : ema > 24 ? 2 : 3;
}
const seekT = parseFloat(new URLSearchParams(location.search).get('t')) || 0;
function begin() { if (!ac || ac.state === 'closed') initAudio(); if (ac && ac.state === 'suspended') ac.resume(); tClock = seekT; ended = false; playing = true; startEl.classList.add('hidden'); if (ac) { try { scheduleAudio(ac.currentTime - seekT); } catch (e) { } } }
startEl.addEventListener('click', begin);
window.__ctl = { begin, renderAudioOffline, scene, cam, seek(t, n = 1) { manual = true; startEl.classList.add('hidden'); renderFrame(t, n); }, times: { T_SLAM, T_WIN, T_TORCH_OFF } };
tClock = seekT; frame();
</script>
