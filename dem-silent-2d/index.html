<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dem Silent Reel</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #frame { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000; overflow: hidden; }
  canvas#gl { width: 100%; height: 100%; display: block; }
  #start { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #e3d2b8; cursor: pointer;
           background: radial-gradient(ellipse at 50% 60%, rgba(30,14,14,.88), rgba(0,0,0,.97)); z-index: 5; }
  #start h1 { font: 400 clamp(22px, 6vh, 44px) Georgia, "Times New Roman", serif; letter-spacing: .4em; margin: 0 0 14px; padding-left: .4em; }
  #start p { margin: 6px 0; opacity: .65; font-size: clamp(11px, 1.8vh, 14px); letter-spacing: .16em; }
  #start .go { margin-top: 28px; padding: 12px 26px; border: 1px solid rgba(227,210,184,.6); display: inline-block; letter-spacing: .32em; font-size: clamp(11px, 1.8vh, 14px); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="start"><div><h1>DEM</h1><p>A SILENT REEL &middot; 31 SECONDS</p><p>SOUND ON</p><div class="go" id="goTxt">TAP TO PLAY</div></div></div>
</div>

<script>
/* ============================================================================ utilities */
const DURATION = 31.2, FPSF = 24, PW = 540, PH = 960;
const lerp = (a, b, t) => a + (b - a) * t, clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOut = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const noise1 = x => Math.sin(x * 1.3) * .5 + Math.sin(x * 2.7 + 1.3) * .3 + Math.sin(x * 5.9 + 4.1) * .2;
const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const bump = (t, t0, w) => Math.exp(-Math.pow((t - t0) / w, 2));
const V = v => { v = clamp(v, 0, 255) | 0; return `rgb(${v},${v},${v})`; };

/* ============================================================================ the shared timeline (picture and sound) */
const T_END = 16.2;
const tauOf = t => t <= T_END ? t : t < 17.8 ? T_END : t <= 23.8 ? T_END - 7.4 * smooth(17.8, 20.4, t) - .8 * smooth(20.2, 22.0, t) - 8.0 * smooth(21.8, 23.8, t) : (t - 23.8) * .35;
const firstBelow = (lim, fb) => { for (let t = 17.8; t < 23.8; t += .0005) if (tauOf(t) <= lim) return t; return fb; };
const T_SLAM = firstBelow(9.0, 20.4), T_WIN = firstBelow(5.8, 22.7), T_TORCH_OFF = firstBelow(9.4, 20.6);
const POUND = [20.55, 20.95, 21.3, 21.65, 21.95, 22.2];
const burstAngle = t => { const u = (t - 9.0) / .5; if (u <= 0) return 0; return clamp(1.75 * (1 - Math.exp(-u * 8) * Math.cos(u * 7)), 0, 1.82); };
const rattle = (t, times, w = .06) => times.reduce((s, t0) => s + Math.sin((t - t0) * 70) * bump(t, t0 + .05, w), 0);
const dipAt = t => smooth(3.8, 4.6, t) * (1 - smooth(5.0, 6.2, t));
const TAPS = (() => { const r = mulberry(91), make = (t0, t1, p0, p1) => { const out = []; let t = t0; while (t < t1) { out.push(t); const u = clamp((t - t0) / (t1 - t0), 0, 1); t += lerp(p0, p1, u) * (.7 + .6 * r()); if (r() < .25) out.push(t - lerp(p0, p1, u) * .62); } return out.sort((a, b) => a - b); }; return { f1: [1.7, 2.15, 2.7, 2.85, 3.35, 3.8, 3.95, 4.25], f2: [2.4, 3.0, 3.45, 3.9, 4.2], r1: make(T_WIN, 26.4, .42, .2), r2: make(T_WIN + .12, 26.4, .46, .22) }; })();
const knock = (t, list) => list.reduce((s, t0) => s + Math.exp(-Math.pow((t - t0) / .045, 2)), 0);
const figVis = (t, tau) => t <= T_END ? smooth(.8, 3.0, t) * (1 - smooth(4.4, 5.6, t)) : t >= 17.8 ? smooth(5.8, 3.6, tau) : 0;
const EYE_N = 14, eyeA = i => 12.1 + i * .2, eyeB = i => 18.1 + i * .12;
// distance walked: the same number drives the forest, the footsteps and the bob
const DW = (() => { const dt = .005, n = Math.ceil(T_END / dt), tab = new Float32Array(n + 2); let d = 0; for (let i = 0; i <= n + 1; i++) { const t = i * dt; tab[i] = d; d += (.85 * smooth(.6, 1.2, t) * (1 - smooth(4.4, 5.0, t)) + .9 * smooth(5.2, 5.8, t) * (1 - smooth(8.0, 8.4, t)) + 1.1 * smooth(9.5, 10.0, t) * (1 - smooth(11.4, 11.7, t)) + 1.25 * smooth(11.4, 12.5, t) * (1 - smooth(15.6, 16.2, t))) * dt; } return t => { const f = clamp(t, 0, T_END) / dt, i = Math.floor(f); return lerp(tab[i], tab[i + 1], f - i); }; })();
const FW = (() => { const dt = .005, n = Math.ceil(T_END / dt), tab = new Float32Array(n + 2); let d = 0; for (let i = 0; i <= n + 1; i++) { const t = i * dt; tab[i] = d; d += 1.25 * smooth(11.4, 12.5, t) * (1 - smooth(15.6, 16.2, t)) * dt; } return t => { const f = clamp(t, 0, T_END) / dt, i = Math.floor(f); return lerp(tab[i], tab[i + 1], f - i); }; })();

/* ============================================================================ the picture: flat, drawn, in tonal values (0..255) */
const sc = document.createElement('canvas'); sc.width = PW; sc.height = PH; const g = sc.getContext('2d');

// a tall watcher: long coat, chalk face, hollow eyes, long fingers. yH = the head's centre, s = scale.
function drawFig(x, yH, s, a, tilt, k, mode) {
  if (a < .01) return;
  g.save(); g.globalAlpha *= a; g.translate(x, 0);
  g.fillStyle = V(17); g.beginPath(); g.moveTo(-26 * s, yH + 48 * s); g.quadraticCurveTo(-54 * s, yH + 60 * s, -60 * s, yH + 150 * s); g.lineTo(-86 * s, yH + 560 * s); g.lineTo(86 * s, yH + 560 * s); g.lineTo(60 * s, yH + 150 * s); g.quadraticCurveTo(54 * s, yH + 60 * s, 26 * s, yH + 48 * s); g.closePath(); g.fill();
  g.strokeStyle = V(70); g.lineWidth = 2 * s; g.beginPath(); g.moveTo(26 * s, yH + 48 * s); g.quadraticCurveTo(54 * s, yH + 60 * s, 60 * s, yH + 150 * s); g.stroke();       // rim of moonlight
  g.fillStyle = V(185); g.fillRect(-7 * s, yH + 32 * s, 14 * s, 28 * s);
  g.save(); g.translate(0, yH + 50 * s); g.rotate(tilt); g.translate(0, -50 * s);
  g.fillStyle = V(216); g.beginPath(); g.ellipse(0, 0, 26 * s, 40 * s, 0, 0, 7); g.fill();
  g.fillStyle = V(13); g.beginPath(); g.ellipse(0, -6 * s, 28 * s, 41 * s, 0, Math.PI, Math.PI * 2); g.closePath(); g.fill();
  g.fillStyle = V(5); for (const sd of [-1, 1]) { g.beginPath(); g.ellipse(sd * 10 * s, 5 * s, 6.5 * s, 11.5 * s, -sd * .2, 0, 7); g.fill(); }
  g.strokeStyle = V(40); g.lineWidth = 2 * s; g.beginPath(); g.moveTo(-8 * s, 25 * s); g.lineTo(8 * s, 25.5 * s); g.stroke();
  g.restore();
  g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = V(20); g.lineWidth = 15 * s;
  const hand = (hx, hy, dir) => { g.fillStyle = V(206); g.beginPath(); g.ellipse(hx, hy, 11 * s, 13 * s, 0, 0, 7); g.fill(); g.strokeStyle = V(206); g.lineWidth = 3.6 * s; for (let i = 0; i < 5; i++) { g.beginPath(); g.moveTo(hx + (i - 2) * 5.5 * s, hy - dir * 6 * s); g.lineTo(hx + (i - 2) * 8.5 * s, hy - dir * (40 + (i === 2 ? 9 : i === 0 || i === 4 ? -5 : 0)) * s); g.stroke(); } g.strokeStyle = V(20); g.lineWidth = 15 * s; };
  if (mode === 'tap') {
    const tx = -70 * s, ty = yH + 70 * s + 2.5 * k;
    g.beginPath(); g.moveTo(-42 * s, yH + 72 * s); g.lineTo(-100 * s, yH + 150 * s); g.lineTo(tx, ty + 6 * s); g.stroke(); hand(tx, ty, 1);
    g.beginPath(); g.moveTo(42 * s, yH + 72 * s); g.lineTo(62 * s, yH + 260 * s); g.lineTo(56 * s, yH + 400 * s); g.stroke(); hand(56 * s, yH + 410 * s, -1);
  } else {
    for (const sd of [-1, 1]) { const hx = sd * 74 * s, hy = yH + 118 * s + (sd > 0 ? 2.5 * k : 0); g.beginPath(); g.moveTo(sd * 42 * s, yH + 72 * s); g.lineTo(sd * 104 * s, yH + 160 * s); g.lineTo(hx, hy + 6 * s); g.stroke(); hand(hx, hy, 1); }
  }
  g.restore();
}

function drawWindow(wx, idx, t, tau, fv, dip) {
  const x0 = wx - 95, y0 = 150, w = 190, h = 300, br = 1 - .82 * dip, rew = t >= 17.8;
  g.save(); g.beginPath(); g.rect(x0, y0, w, h); g.clip();
  const sky = g.createLinearGradient(0, y0, 0, 350); sky.addColorStop(0, V(24 * br)); sky.addColorStop(1, V(94 * br)); g.fillStyle = sky; g.fillRect(x0, y0, w, 210);
  if (idx === 1) { const mx = x0 + 140, my = y0 + 42, mg = g.createRadialGradient(mx, my, 4, mx, my, 72); mg.addColorStop(0, `rgba(255,255,255,${.85 * br})`); mg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = mg; g.fillRect(x0, y0, w, 150); g.fillStyle = V(246 * br); g.beginPath(); g.arc(mx, my, 13, 0, 7); g.fill(); }
  const fog = g.createLinearGradient(0, 290, 0, 420); fog.addColorStop(0, V(62 * br)); fog.addColorStop(.55, V(122 * br)); fog.addColorStop(1, V(34 * br)); g.fillStyle = fog; g.fillRect(x0, 290, w, 140);   // the fog bank the watchers stand against
  g.fillStyle = V(10); for (let k = 0; k < 7; k++) { const tx = x0 + 14 + k * 28 + (k * 13 % 9), th = 40 + (k * 37 % 40); g.beginPath(); g.moveTo(tx - 16, 340); g.lineTo(tx, 340 - th); g.lineTo(tx + 16, 340); g.fill(); }
  g.fillStyle = V(15); g.fillRect(x0, 340, w, 120);
  const far = fv * smooth(.4 + idx * .3, 2.2 + idx * .4, Math.min(t, 5));
  for (let k = 0; k < 3; k++) { const fx = x0 + 28 + k * 62 + idx * 7, fh = 34 + (k * 9 % 12); g.save(); g.globalAlpha *= far; g.fillStyle = V(9); g.fillRect(fx - 5, 346 - fh, 10, fh); g.fillStyle = V(165); g.beginPath(); g.arc(fx, 346 - fh - 4, 5, 0, 7); g.fill(); g.restore(); }
  const list = idx ? (rew ? TAPS.r2 : TAPS.f2) : (rew ? TAPS.r1 : TAPS.f1), kk = knock(t, list), inch = rew ? 10 * smooth(23.8, 26.2, t) : 0;
  drawFig(wx + (idx ? 6 : -4), 205 + inch * .3, (1 + inch * .006) * (.82 + .18 * fv), fv * fv * (3 - 2 * fv), .12 * Math.sin(t * .35 + idx * 2) + (idx ? -.05 : .06), kk, idx ? 'press' : 'tap');
  // breath on the glass, a soft reflection
  const bm = g.createRadialGradient(wx + (idx ? 6 : -4), 232, 2, wx + (idx ? 6 : -4), 232, 46); bm.addColorStop(0, `rgba(215,225,232,${fv * fv * (.1 + .12 * (.5 + .5 * Math.sin(t * 1.5 + idx * 2.2)))})`); bm.addColorStop(1, 'rgba(215,225,232,0)'); g.fillStyle = bm; g.fillRect(x0, 180, w, 120);
  const rf = g.createLinearGradient(x0, y0, x0 + w, y0 + h); rf.addColorStop(0, 'rgba(255,255,255,.1)'); rf.addColorStop(.35, 'rgba(255,255,255,0)'); g.fillStyle = rf; g.fillRect(x0, y0, w, h);
  g.restore();
  // sheer, frame, mullions, sill
  g.fillStyle = 'rgba(190,196,190,.07)'; g.fillRect(x0, y0, w, h);
  g.fillStyle = V(22); g.fillRect(x0 - 8, y0 - 8, w + 16, 8); g.fillRect(x0 - 8, y0 + h, w + 16, 6); g.fillRect(x0 - 8, y0, 8, h); g.fillRect(x0 + w, y0, 8, h);
  g.fillRect(wx - 3, y0, 6, h); g.fillRect(x0, 250, w, 5); g.fillRect(x0, 350, w, 5);
  g.fillStyle = V(80); g.fillRect(x0 - 12, y0 + h + 6, w + 24, 12); g.fillStyle = V(120); g.fillRect(x0 - 12, y0 + h + 6, w + 24, 2);
  // moonlight thrown across the floor, broken by the mullions
  g.save(); g.fillStyle = `rgba(200,210,220,${.2 * br})`; g.beginPath(); g.moveTo(x0, 562); g.lineTo(x0 + w, 562); g.lineTo(x0 + w + 70, 668); g.lineTo(x0 + 70, 668); g.closePath(); g.fill();
  g.fillStyle = V(30); g.fillRect(wx - 3, 562, 6, 106); g.restore();
}

function drawDoor(t, tau, rew) {
  const x0 = 1100, y0 = 160, y1 = 560, W = 160;
  let th, hr;
  if (!rew) { th = burstAngle(t) + .006 * rattle(t, [7.7, 8.15, 8.65]); hr = -.55 * (bump(t, 7.75, .1) + bump(t, 8.2, .1) + bump(t, 8.7, .12)); }
  else if (tau > 9.0) { th = burstAngle(tau); hr = 0; }
  else { th = .012 * POUND.reduce((s, t0) => s + Math.sin((t - t0) * 60) * bump(t, t0 + .05, .07), 0); hr = -.7 * POUND.reduce((s, t0) => s + bump(t, t0 + .02, .09), 0); }
  g.fillStyle = V(22); g.fillRect(x0 - 16, y0 - 16, W + 32, y1 - y0 + 16);
  const dw = g.createLinearGradient(0, y0, 0, y1); dw.addColorStop(0, V(2)); dw.addColorStop(1, V(14)); g.fillStyle = dw; g.fillRect(x0, y0, W, y1 - y0);
  const rg = g.createRadialGradient(x0 + 80, y1 - 60, 4, x0 + 80, y1 - 60, 110); rg.addColorStop(0, 'rgba(120,135,160,.30)'); rg.addColorStop(1, 'rgba(120,135,160,0)'); g.fillStyle = rg; g.fillRect(x0, y0, W, y1 - y0);   // fog beyond
  g.fillStyle = V(8); for (let k = 0; k < 4; k++) g.fillRect(x0 + 18 + k * 38, y0, 10 + (k % 2) * 6, y1 - y0 - 70);
  const sn = Math.sin(th), cs = Math.cos(th), xf = x0 + W * cs, ex = 36 * sn, shake = th < .2 ? 1.3 * rattle(t, [7.7, 8.15, 8.65]) + (rew ? 1.6 * POUND.reduce((s, t0) => s + Math.sin((t - t0) * 60) * bump(t, t0 + .05, .07), 0) : 0) : 0;
  const pt = (u, v) => { const x = lerp(x0, xf, u) + shake, top = lerp(y0, y0 - ex, u), bot = lerp(y1, y1 + ex, u); return [x, lerp(top, bot, v)]; };
  const shade = lerp(66, 22, sn);
  g.fillStyle = V(shade); g.beginPath(); for (const [u, v] of [[0, 0], [1, 0], [1, 1], [0, 1]]) { const [x, y] = pt(u, v); g.lineTo(x, y); } g.closePath(); g.fill();
  if (Math.abs(cs) > .12) for (const [ua, ub, va, vb] of [[.1, .46, .05, .3], [.54, .9, .05, .3], [.1, .46, .36, .6], [.54, .9, .36, .6], [.1, .46, .66, .94], [.54, .9, .66, .94]]) { g.fillStyle = V(shade * .72); g.strokeStyle = V(shade * 1.5); g.lineWidth = 1.6; g.beginPath(); for (const [u, v] of [[ua, va], [ub, va], [ub, vb], [ua, vb]]) { const [x, y] = pt(u, v); g.lineTo(x, y); } g.closePath(); g.fill(); g.stroke(); }
  const [hx, hy] = pt(.88, .52); g.fillStyle = V(178); g.beginPath(); g.arc(hx, hy, 6, 0, 7); g.fill(); g.strokeStyle = V(178); g.lineWidth = 4; g.lineCap = 'round'; g.beginPath(); g.moveTo(hx, hy); g.lineTo(hx - 24 * Math.max(.4, cs), hy + 6 * Math.sin(hr * 3)); g.stroke();
  const age = !rew ? t - 9.0 : 0;
  if (age > 0 && age < 2.4) { const r = mulberry(5); g.save(); for (let i = 0; i < 70; i++) { const a = r() * 6.28, sp = .4 + r() * 1.6, k = (1 - Math.exp(-2.2 * age)) / 2.2; g.fillStyle = `rgba(170,170,160,${clamp(1 - age / 2.4, 0, 1) * .5})`; g.beginPath(); g.arc(x0 + 80 + Math.cos(a) * sp * k * 120, 360 + Math.sin(a) * sp * k * 150 + 20 * age * age, 1.2 + k * 3.5, 0, 7); g.fill(); } g.restore(); }
}

function cam(tau) {
  const a = smooth(.6, 4.4, tau), pan = smooth(5.0, 7.0, tau), appr = smooth(7.0, 8.8, tau), thru = smooth(9.5, 10.9, tau), jolt = smooth(9.0, 9.15, tau) * (1 - smooth(9.2, 9.8, tau));
  let cx = lerp(lerp(200, 340, a), 1180, pan), z = lerp(lerp(1.0, 1.22, smooth(0, 4.6, tau)), 1.1, pan) + .45 * appr - .16 * jolt;
  z = lerp(z, 5.2, thru); const cy = lerp(360, 330, thru);
  return { cx: cx + 3 * noise1(tau * 1.3) + 4 * jolt * Math.sin(tau * 90), cy: cy + 2 * noise1(tau * 1.7 + 3) + 3 * jolt * Math.cos(tau * 77), z, rot: .004 * noise1(tau * .9) };
}

function drawInterior(tau, t, rew, dip) {
  const c = cam(tau), fv = figVis(t, tau), lampB = 1 - .78 * dip;
  g.save(); g.translate(270, 360); g.rotate(c.rot); g.scale(c.z, c.z); g.translate(-c.cx, -c.cy);
  const wl = g.createLinearGradient(0, 60, 0, 560); wl.addColorStop(0, V(54)); wl.addColorStop(.5, V(108)); wl.addColorStop(1, V(80)); g.fillStyle = wl; g.fillRect(-300, 60, 2400, 500);
  g.strokeStyle = 'rgba(0,0,0,.12)'; g.lineWidth = 2; for (let x = -300; x < 2100; x += 46) { g.beginPath(); g.moveTo(x, 60); g.lineTo(x, 560); g.stroke(); }
  g.fillStyle = V(20); g.fillRect(-300, -500, 2400, 562);
  const fl = g.createLinearGradient(0, 560, 0, 780); fl.addColorStop(0, V(52)); fl.addColorStop(1, V(26)); g.fillStyle = fl; g.fillRect(-300, 560, 2400, 800);
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 2; for (let k = 0; k < 6; k++) { const y = 575 + k * k * 4 + k * 12; g.beginPath(); g.moveTo(-300, y); g.lineTo(2100, y); g.stroke(); }
  g.fillStyle = V(30); g.fillRect(-300, 538, 2400, 24);
  // drapes
  for (const [dx, dw] of [[8, 46], [244, 52], [484, 52]]) { const dg = g.createLinearGradient(dx, 0, dx + dw, 0); dg.addColorStop(0, V(18)); dg.addColorStop(.5, V(52)); dg.addColorStop(1, V(16)); g.fillStyle = dg; g.fillRect(dx, 62, dw, 490); g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 1.5; for (let k = 1; k < 6; k++) { g.beginPath(); g.moveTo(dx + k * dw / 6, 62); g.lineTo(dx + k * dw / 6, 552); g.stroke(); } }
  drawWindow(140, 0, t, tau, fv, dip); drawWindow(400, 1, t, tau, fv, dip);
  // the room: a floor lamp, an armchair, a shelf
  g.fillStyle = V(24); g.beginPath(); g.ellipse(700, 548, 22, 7, 0, 0, 7); g.fill(); g.fillRect(698, 330, 4, 218);
  const lg = g.createRadialGradient(700, 320, 6, 700, 320, 280); lg.addColorStop(0, `rgba(255,236,200,${.5 * lampB})`); lg.addColorStop(1, 'rgba(255,236,200,0)'); g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = lg; g.fillRect(430, 40, 540, 520); g.restore();
  g.fillStyle = V(238 * lampB + 14); g.beginPath(); g.moveTo(678, 320); g.lineTo(722, 320); g.lineTo(734, 360); g.lineTo(666, 360); g.closePath(); g.fill();
  g.fillStyle = V(22); g.beginPath(); g.roundRect(730, 466, 110, 78, 12); g.fill(); g.beginPath(); g.roundRect(738, 392, 94, 92, 14); g.fill(); g.beginPath(); g.roundRect(722, 440, 24, 100, 9); g.fill(); g.beginPath(); g.roundRect(824, 440, 24, 100, 9); g.fill();
  g.fillStyle = V(26); g.fillRect(900, 150, 96, 392); g.strokeStyle = V(54); g.lineWidth = 3; for (let k = 0; k < 5; k++) { g.beginPath(); g.moveTo(902, 190 + k * 80); g.lineTo(994, 190 + k * 80); g.stroke(); } g.fillStyle = V(44); for (let k = 0; k < 4; k++) for (let j = 0; j < 3; j++) g.fillRect(908 + j * 28, 192 + k * 80 + 16, 18, 40 - (j * 7 % 11));
  drawDoor(t, tau, rew);
  g.restore();
}

// the forest: trunks come toward you as you walk, a torch makes a pool of light, red glows watch from between the trees
const FOR = (() => { const r = mulberry(33), trunks = [], tufts = []; for (let i = 0; i < 40; i++) { let X; do { X = (r() - .5) * 20; } while (Math.abs(X) < 1.7); trunks.push({ X, Z0: .8 + r() * 24, wm: .35 + r() * .35, tone: 8 + r() * 16, ph: r() * 9 }); } for (let i = 0; i < 46; i++) tufts.push({ X: (r() - .5) * 12, Z0: .8 + r() * 14, n: 3 + (r() * 3 | 0), ph: r() }); const eyes = []; for (let i = 0; i < EYE_N; i++) { let X; do { X = (r() - .5) * 16; } while (Math.abs(X) < 2.2); eyes.push({ X, Ze: 7 + r() * 16, hgt: 1.1 + r() * 1.3, ph: r() * 6 }); } return { trunks, tufts, eyes }; })();
const HZ = 400, KY = 130, KX = 150;
function drawForest(tau, t, rew) {
