<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Case 017, Part 1 "The Watch": 25 s flat-cutouts reel (script: ../reels-case-017.md), built in the approved Sirens / Mae Nak look:
// mid-tone storybook scenes, flat shapes, soft glows, reflections, cutout puppets in profile, karaoke captions. 1080×1920, 30 fps.
const W = 1080, H = 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, s, d) => clamp((t - s) / d), sm = t => t * t * (3 - 2 * t), io = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2, oC = t => 1 - Math.pow(1 - t, 3);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const STARS = (() => { const R = mulberry(4), a = []; for (let i = 0; i < 70; i++) a.push([R() * W, R() * 820, .6 + R() * 1.6, R() * 6]); return a; })();
const LAMP = '255,196,120';

// ---------------------------------------------------------------- helpers (same as the Sirens build)
function glow(x, y, r, col, a) { if (a <= 0) return; ctx.save(); ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(.35, `rgba(${col},${a * .45})`); g.addColorStop(1, `rgba(${col},0)`); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore(); }
function tube(x1, y1, x2, y2, w, col) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function poly(pts, col) { ctx.fillStyle = col; ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill(); }
function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function rrect(x, y, w, h, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function circ(x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function ell(x, y, a, b, col, rot = 0) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, a, b, rot, 0, 7); ctx.fill(); }
function vg(y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function lines(x0, x1, y0, y1, step, col, vert) { ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); if (vert) for (let x = x0; x <= x1; x += step) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); } else for (let y = y0; y <= y1; y += step) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); } ctx.stroke(); }
function haze(y, h, col, a) { const g = ctx.createLinearGradient(0, y - h, 0, y + h); g.addColorStop(0, `rgba(${col},0)`); g.addColorStop(.5, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`); ctx.fillStyle = g; ctx.fillRect(-300, y - h, W + 600, h * 2); }
function mist(y, h, a, t, speed, seed) { const R = mulberry(seed); ctx.save(); ctx.filter = 'blur(22px)'; for (let i = 0; i < 6; i++) { const w = 340 + R() * 380, x = ((R() * (W + 800) + t * speed) % (W + 800)) - 400; ctx.fillStyle = `rgba(200,212,226,${a * (.6 + R() * .4)})`; ctx.beginPath(); ctx.ellipse(x, y + (R() - .5) * h, w, h * (.3 + R() * .3), 0, 0, 7); ctx.fill(); } ctx.restore(); }
function water(horizon, a, b, t) { ctx.fillStyle = vg(horizon, H, [[0, a], [1, b]]); ctx.fillRect(-300, horizon, W + 600, H); const R = mulberry(9); ctx.strokeStyle = 'rgba(170,195,230,.12)'; ctx.lineWidth = 2;
  for (let i = 0; i < 40; i++) { const y = horizon + 14 + Math.pow(R(), 1.6) * (H - horizon), len = 40 + R() * 150 * (1 + (y - horizon) / 500), x = ((R() * (W + 400) + t * (10 + R() * 12)) % (W + 400)) - 200; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y); ctx.stroke(); } }
function reflect(horizon, fn, a = .3) { ctx.save(); ctx.beginPath(); ctx.rect(-300, horizon, W + 600, H); ctx.clip(); ctx.translate(0, 2 * horizon); ctx.scale(1, -1); ctx.globalAlpha = a; ctx.filter = 'blur(3px)'; fn(); ctx.restore(); }
function vignette(a = .55) { const g = ctx.createRadialGradient(W / 2, H * .45, 420, W / 2, H * .5, 1250); g.addColorStop(0, 'rgba(4,6,12,0)'); g.addColorStop(1, `rgba(4,6,12,${a})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = vg(H * .74, H, [[0, 'rgba(3,4,8,0)'], [1, 'rgba(3,4,8,.55)']]); ctx.fillRect(0, H * .74, W, H * .26); }
function push(cx, cy, k) { ctx.translate(cx, cy); ctx.scale(k, k); ctx.translate(-cx, -cy); }
function pine(x, y, h, col) { poly([[x, y - h], [x - h * .2, y - h * .5], [x - h * .1, y - h * .5], [x - h * .28, y], [x + h * .28, y], [x + h * .1, y - h * .5], [x + h * .2, y - h * .5]], col); }

// ---------------------------------------------------------------- puppets (flat parts, profile, rotate at joints)
const VSKIN = '#b98763', VSKIN_D = '#9c6f50', DSKIN = '#c4895c';
function head(x, y, s, o) {      // facing right. o: skin, hair, grey sides, moustache, glasses, closed, tilt
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.tilt || 0); ctx.scale(s, s);
  ell(0, 0, 27, 31, o.skin); poly([[22, -4], [33, 7], [23, 12]], o.skin); circ(-6, 4, 6, o.skinD);
  ctx.fillStyle = o.hair; ctx.beginPath(); ctx.moveTo(-28, 10); ctx.quadraticCurveTo(-32, -34, 6, -33); ctx.quadraticCurveTo(28, -30, 26, -12); ctx.lineTo(10, -16); ctx.quadraticCurveTo(-8, -14, -14, 10); ctx.closePath(); ctx.fill();
  if (o.closed) tube(9, -3, 20, -1, 2.5, '#2a1d18'); else { ell(14, -4, 6, 4, '#f4efe6'); circ(16, -4, 2.6, '#1b1b1f'); }
  if (o.moustache) poly([[13, 12], [30, 11], [28, 17], [14, 18]], o.moustache);
  else ell(18, 17, 5, 1.6, '#4a2224');
  if (o.glasses) { ell(15, -4, 11, 8, 'rgba(225,238,246,.45)'); tube(4, -5, -6, -2, 2, 'rgba(225,238,246,.7)'); }
  ctx.restore();
}
function armchair(x, y, s) {     // side view, back on the left, facing right; (x,y) = seat front edge on the floor line
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  rrect(-260, -470, 80, 420, 30, '#5e2a26'); rrect(-250, -460, 40, 400, 18, '#6c322c');
  rrect(-250, -170, 260, 70, 18, '#6c322c'); rrect(-200, -250, 240, 34, 14, '#5e2a26');
  rect(-240, -100, 20, 100, '#3a1d18'); rect(-10, -100, 20, 100, '#3a1d18');
  ctx.restore();
}
function vikram(x, y, s, slump, t) {   // seated in profile facing right; (x,y) hip. slump 0..1 = alive → dead
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const lean = -.12 + slump * .25, br = (1 - slump) * Math.sin(t * 2) * 1.5;
  tube(0, 0, 120, 6, 50, '#3b3f4b'); tube(120, 6, 128, 150, 40, '#3b3f4b'); ell(140, 158, 34, 12, '#4e3424');                 // trousers, slipper
  ctx.save(); ctx.rotate(lean);
  poly([[-34, 0], [34, 0], [30, -150 - br], [-30, -148 - br]], '#e5dccb');                                                   // kurta
  poly([[-40, -60], [-36, -160 - br], [34, -158 - br], [44, -100], [20, -60]], '#7e8189');                                     // shawl
  ctx.strokeStyle = '#6c6f76'; ctx.lineWidth = 3; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(-38 + i * 11, -58); ctx.lineTo(-38 + i * 11, -38); ctx.stroke(); }
  tube(6, -140, 30, -70, 26, '#7e8189'); tube(30, -70, 112, -64, 22, '#7e8189'); circ(124, -64, 12, VSKIN);               // arm along the armrest
  head(8 + slump * 18, -190 - br + slump * 26, 1.05, { skin: VSKIN, skinD: VSKIN_D, hair: '#d6d9de', moustache: '#d6d9de', glasses: slump < .5, closed: slump > .3, tilt: slump * .75 });
  ctx.restore(); ctx.restore();
}
function doctor(x, y, s, t, write) {  // standing in profile facing left; black bag in the far hand, notepad and pen in the near hand
  ctx.save(); ctx.translate(x, y); ctx.scale(-s, s);
  const br = Math.sin(t * 2) * 1.5, wr = write ? Math.sin(t * 14) * 5 : 0;
  tube(-12, -250, -18, 0, 30, '#262c3a'); tube(14, -250, 22, 0, 30, '#2c3344'); ell(-6, 4, 26, 9, '#14161b'); ell(36, 4, 26, 9, '#14161b');
  tube(-10, -420, -26, -250, 24, '#2a3142'); tube(-26, -250, -30, -150, 20, '#2a3142');
  poly([[-12, -150], [-60, -150], [-70, -70], [0, -70]], '#121418'); tube(-50, -150, -22, -150, 6, '#121418');
  poly([[-40, -255], [44, -255], [40, -440 - br], [-36, -440 - br]], '#353d52'); poly([[-6, -440 - br], [22, -440 - br], [8, -380]], '#e9e6de');
  head(4, -490 - br, 1.05, { skin: DSKIN, skinD: '#a8714a', hair: '#26262b', glasses: true });
  tube(26, -420, 60, -330, 24, '#3b445a'); tube(60, -330, 92 + wr * .3, -360, 20, '#3b445a');
  rect(84, -400, 46, 62, '#f1e9d8'); tube(96 + wr, -370, 112 + wr, -392, 5, '#16181d'); circ(92 + wr * .3, -360, 9, DSKIN);
  ctx.restore();
}
function lampTable(x, y, s, on) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  rect(-60, -230, 120, 16, '#4a3020'); tube(0, -214, 0, 0, 12, '#3a2618'); tube(-44, 0, 44, 0, 10, '#3a2618');
  tube(0, -230, 0, -330, 7, '#3a2618'); poly([[-48, -320], [48, -320], [32, -390], [-32, -390]], on > .5 ? '#f0cf8c' : '#a08660');
  ctx.restore(); if (on > 0) { glow(x, y - 340 * s, 520 * s, LAMP, .5 * on); glow(x, y - 340 * s, 1100 * s, LAMP, .14 * on); } }
function studyWall(top, bottom, base, line) { rect(-300, -300, W + 600, bottom + 300, base); lines(-300, W + 300, top, bottom, 120, line, true); lines(-300, W + 300, top, bottom, 150, line, false); }
function floor(y, base, line) { rect(-300, y, W + 600, H, base); ctx.strokeStyle = line; ctx.lineWidth = 3; ctx.beginPath(); for (let k = y + 40, i = 0; k < H + 40; i++, k += 50 + i * 12) { ctx.moveTo(-300, k); ctx.lineTo(W + 300, k); } ctx.stroke(); }

// ---------------------------------------------------------------- scenes
const HOR = 1180;
function houseLayer(t) {          // Hollow Pines: the house on stilts at the water's edge, pines, one lit study window
  const R = mulberry(12); for (let i = 0; i < 16; i++) pine(-40 + i * 72 + R() * 24, HOR - 10 + R() * 16, 200 + R() * 140, '#14212e');
  const hx = 300, hy = 780;
  for (let i = 0; i < 7; i++) tube(hx + 26 + i * 78, hy + 250, hx + 26 + i * 78, HOR + 6, 14, '#2b1f17');
  rect(hx - 30, hy + 236, 580, 22, '#3a2a1e'); for (let i = 0; i < 18; i++) tube(hx + 470 + (i % 2) * 0, 0, 0, 0, 0, 'transparent');
  rect(hx, hy, 520, 240, '#5a4130'); lines(hx, hx + 520, hy, hy + 240, 52, '#4b3527', true); lines(hx, hx + 520, hy, hy + 240, 60, '#4b3527', false);
  poly([[hx - 70, hy + 10], [hx + 260, hy - 210], [hx + 590, hy + 10]], '#3a271b'); poly([[hx + 260, hy - 210], [hx + 590, hy + 10], [hx + 430, hy + 10]], '#2f1f15');
  ctx.strokeStyle = '#4a3324'; ctx.lineWidth = 2; for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.moveTo(hx + 260, hy - 200); ctx.lineTo(hx + 120 + i * 35, hy - 30); ctx.stroke(); }
  for (const [x, lit] of [[hx + 50, 0], [hx + 210, 0], [hx + 370, 1]]) { rect(x, hy + 70, 100, 110, lit ? '#f2c77c' : '#1d2630'); rect(x + 47, hy + 70, 6, 110, lit ? '#c99d5c' : '#26303b'); if (lit) { glow(x + 50, hy + 125, 240, LAMP, .5); glow(x + 50, hy + 125, 600, LAMP, .1); } }
}
function sHouse(t, still) {
  ctx.fillStyle = vg(0, HOR, [[0, '#0b1422'], [.6, '#16253a'], [1, '#2a3c55']]); ctx.fillRect(-300, -300, W + 600, HOR + 300);
  for (const [x, y, r, ph] of STARS) circ(x, y, r, `rgba(230,236,245,${.35 + .35 * Math.sin(t * 1.3 + ph)})`);
  glow(820, 360, 260, '205,215,235', .25); circ(820, 360, 40, '#ebe7da');
  ctx.save(); if (!still) push(560, 1000, 1 + .04 * io(seg(t, 0, 1.6)));
  for (let i = 0; i < 10; i++) pine(-60 + i * 130, HOR, 120 + (i * 37 % 60), '#1c2b3d');
  haze(HOR - 40, 90, '120,150,190', .25);
  houseLayer(t);
  water(HOR, '#1d2d44', '#080d16', t);
  reflect(HOR, () => { circ(820, 360, 40, '#ebe7da'); houseLayer(t); });
  mist(HOR - 30, 70, .14, t, 16, 2); mist(HOR + 140, 90, .1, t, -12, 6);
  ctx.restore(); vignette(.55);
}
function study(t, lamp, k = 1) {  // lamp-lit study interior, side view: armchair, Vikram, lamp
  studyWall(160, 1340, '#7a5232', '#6a4529'); floor(1340, '#4f3420', '#43291a');
  rect(600, 520, 260, 300, '#22303e'); rect(600, 520, 260, 300, 'rgba(0,0,0,0)'); lines(600, 860, 520, 820, 130, '#4a3020', true); rect(590, 510, 280, 16, '#4a3020'); rect(590, 816, 280, 16, '#4a3020');
  circ(800, 590, 22, '#dfe3e8'); glow(800, 590, 120, '200,212,235', .2);
  lampTable(900, 1340, 1, lamp);
  glow(560, 900, 900, LAMP, .1 * lamp);
}
function sChair(t) {              // he dies in his armchair: the head drops slowly, glasses slip; the lamp flickers once
  const fl = 1 - .7 * Math.exp(-Math.pow((t - 2.0) * 22, 2)) - .4 * Math.exp(-Math.pow((t - 2.09) * 30, 2));
  ctx.save(); push(420, 1120, 1.35 + .04 * seg(t, 1.2, 1.7));
  study(t, fl); armchair(470, 1340, 1); vikram(330, 1180, 1, sm(seg(t, 1.45, 1.0)), t);
  const gl = sm(seg(t, 1.9, .5)); if (gl > 0) { ctx.save(); ctx.translate(lerp(370, 420, gl), lerp(1000, 1158, gl)); ctx.rotate(gl * .8); ell(-14, 0, 12, 9, 'rgba(225,238,246,.6)'); ell(14, 0, 12, 9, 'rgba(225,238,246,.6)'); ctx.restore(); }
  ctx.restore(); vignette(.5);
}
function sDoctor(t) {             // morning, grey-blue: the doctor at the study door, writing his note
  rect(-300, -300, W + 600, H + 600, '#7d8c99'); lines(-300, W + 300, 160, 1340, 120, '#72818e', true); lines(-300, W + 300, 160, 1340, 150, '#72818e', false);
  floor(1340, '#56626d', '#4c5761');
  rect(150, 460, 380, 880, '#3e3027'); ctx.fillStyle = vg(480, 1340, [[0, '#e4eaee'], [1, '#bccad3']]); ctx.fillRect(170, 480, 340, 860);
  mist(900, 160, .3, t, 16, 3); ctx.save(); ctx.globalAlpha = .25; poly([[170, 1340], [510, 1340], [760, 1900], [0, 1900]], '#e6ecef'); ctx.restore();
  glow(340, 900, 700, '225,235,242', .18);
  ctx.save(); push(540, 1100, 1 + .03 * seg(t, 2.7, 1.2)); doctor(620, 1340, 1.05, t, t > 3.0); ctx.restore();
  ctx.save(); ctx.globalAlpha = .9; armchair(1160, 1340, .9); ctx.restore();
  vignette(.45);
}
function sNote(t) {               // the note, big: "cardiac", then "1.00 am", circled
  rect(-300, -300, W + 600, H + 600, '#6f7d89'); glow(540, 900, 900, '225,235,242', .14);
  const sl = oC(seg(t, 3.75, .5));
  ctx.save(); ctx.translate(540 + (1 - sl) * 900, 980); ctx.rotate(-.03);
  rect(-326, -398, 680, 820, 'rgba(20,28,36,.25)'); rect(-340, -420, 680, 820, '#f1e9d8');
  ctx.strokeStyle = 'rgba(120,140,170,.25)'; ctx.lineWidth = 2; for (let y = -300; y < 380; y += 70) { ctx.beginPath(); ctx.moveTo(-300, y); ctx.lineTo(300, y); ctx.stroke(); }
  ctx.font = 'italic 400 128px "Liberation Serif", serif'; ctx.fillStyle = '#262a33';
  const write = (txt, x, y, s, d) => { const w = ctx.measureText(txt).width, p = seg(t, s, d); ctx.save(); ctx.beginPath(); ctx.rect(x - 10, y - 140, w * p + 10, 200); ctx.clip(); ctx.fillText(txt, x, y); ctx.restore(); return [x + w * p, y - 30]; };
  let pen = write('cardiac', -200, -110, 3.95, .65); if (t > 4.62) pen = write('1.00 am', -170, 150, 4.7, .5);
  const cp = seg(t, 5.22, .42); if (cp > 0) { ctx.strokeStyle = '#b5482e'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.ellipse(10, 110, 250, 105, -.06, -2.6, -2.6 + cp * 6.75); ctx.stroke(); pen = [10 + 250 * Math.cos(-2.6 + cp * 6.75), 110 + 105 * Math.sin(-2.6 + cp * 6.75)]; }
  if (t > 3.9 && t < 5.85) { const wob = Math.sin(t * 40) * 5; ctx.save(); ctx.translate(pen[0], pen[1] + wob); ctx.rotate(-.75); rect(0, -9, 300, 18, '#1f232b'); poly([[0, -8], [-34, 0], [0, 8]], '#c9cdd4'); ctx.restore(); }
  ctx.restore(); vignette(.4);
}
function ecg(x, t, amp) { const u = (x / 70 + t * 2.4) % 1; let y = 0; if (u > .3 && u < .36) y = -Math.sin((u - .3) / .06 * Math.PI); if (u > .36 && u < .42) y = Math.sin((u - .36) / .06 * Math.PI) * .45; if (u > .55 && u < .7) y = -Math.sin((u - .55) / .15 * Math.PI) * .2; return y * amp; }
function sWatch(t) {              // close: his wrist on the armrest, the watch; a second, gloved hand taps "I'm OK"
  studyWall(0, 1250, '#5e3e26', '#52351f'); glow(860, 300, 900, LAMP, .2);
  rect(-300, 1060, W + 600, 900, '#5e2a26'); rect(-300, 1060, W + 600, 40, '#6c322c');                         // armrest
  poly([[-200, 860], [330, 870], [360, 1080], [-200, 1080]], '#7e8189'); ctx.strokeStyle = '#6c6f76'; ctx.lineWidth = 4; for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.moveTo(332 + i * 3, 880 + i * 22); ctx.lineTo(372 + i * 3, 884 + i * 22); ctx.stroke(); }
  tube(330, 975, 820, 990, 128, VSKIN); ell(880, 1005, 100, 66, VSKIN, .05); for (let i = 0; i < 4; i++) tube(940, 975 + i * 22, 1020, 990 + i * 30, 28, i % 2 ? VSKIN_D : VSKIN);
  rect(470, 770, 160, 440, '#1d2026'); rrect(400, 820, 280, 330, 70, '#3a3e46'); rrect(424, 844, 232, 282, 54, '#0c0e11'); tube(690, 930, 690, 990, 16, '#4a4f58');
  const wake = sm(seg(t, 6.9, 1.0)); glow(540, 985, 380, '150,215,200', .3 * wake);
  ctx.save(); ctx.beginPath(); ctx.roundRect(424, 844, 232, 282, 54); ctx.clip(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (wake > 0) rect(424, 844, 232, 282, `rgba(24,52,50,${.7 * wake})`);
  const big = (s, y, size = 80) => { ctx.font = `600 ${size}px Poppins`; ctx.fillStyle = '#f2f5f3'; ctx.fillText(s, 540, y); };
  const trace = amp => { ctx.strokeStyle = '#d6efe5'; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.beginPath(); for (let x = 0; x <= 200; x += 3) { const y = 1062 + ecg(x, t, amp); x ? ctx.lineTo(440 + x, y) : ctx.moveTo(440 + x, y); } ctx.stroke(); };
  if (t < 8.2 && wake > 0) { ctx.strokeStyle = `rgba(210,240,230,${.85 * wake})`; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(540, 985, 56, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * wake); ctx.stroke(); }
  else if (t >= 8.2 && t < 10.15) { big('21:44', 955); trace(66 * (1 + .6 * Math.sin(t * 9))); }
  else if (t >= 10.15 && t < 11.95) { big('SOS', 945, 90); ctx.font = '600 34px Poppins'; ctx.fillStyle = '#d9dee0'; ctx.fillText('in 60 s', 540, 1020); ctx.strokeStyle = '#e8eaea'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(540, 985, 104, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - seg(t, 10.15, 60))); ctx.stroke(); }
  else if (t >= 11.95 && t < 13.1) { const f = 1 - seg(t, 11.95, .3); if (f > 0) rect(424, 844, 232, 282, `rgba(255,255,255,${.7 * f})`); ctx.font = '600 42px Poppins'; ctx.fillStyle = '#f2f5f3'; ctx.fillText('Cancelled', 540, 985); }
  else if (t >= 13.1) { big('21:48', 955); trace(66 * (1 - sm(seg(t, 13.8, .6)))); }
  ctx.restore();
  const inn = io(seg(t, 10.9, .8)) * (1 - io(seg(t, 12.7, .7))), tap = Math.exp(-Math.pow((t - 12.0) * 9, 2));
