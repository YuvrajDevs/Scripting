<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// SIRENS: a 10 s flat-cutouts tale. Flat vector shapes, soft glows, reflections, cutout puppets, karaoke captions. 30 fps, pure function of t.
const W = 1080, H = 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, s, d) => clamp((t - s) / d), sm = t => t * t * (3 - 2 * t), io = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const STARS = (() => { const R = mulberry(4), a = []; for (let i = 0; i < 70; i++) a.push([R() * W, R() * 900, .6 + R() * 1.6, R() * 6]); return a; })();

// ---------------------------------------------------------------- drawing helpers
function glow(x, y, r, col, a) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(.35, `rgba(${col},${a * .45})`); g.addColorStop(1, `rgba(${col},0)`); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore(); }
function tube(x1, y1, x2, y2, w, col) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function poly(pts, col) { ctx.fillStyle = col; ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill(); }
function sky(top, mid, hor, horizon) { const g = ctx.createLinearGradient(0, 0, 0, horizon); g.addColorStop(0, top); g.addColorStop(.6, mid); g.addColorStop(1, hor); ctx.fillStyle = g; ctx.fillRect(-200, -200, W + 400, horizon + 200); }
function water(horizon, a, b, t, sx = 0) {
  const g = ctx.createLinearGradient(0, horizon, 0, H); g.addColorStop(0, a); g.addColorStop(1, b); ctx.fillStyle = g; ctx.fillRect(-200, horizon, W + 400, H - horizon + 200);
  const R = mulberry(9); ctx.strokeStyle = 'rgba(170,195,230,.10)'; ctx.lineWidth = 2;
  for (let i = 0; i < 46; i++) { const y = horizon + 14 + Math.pow(R(), 1.6) * (H - horizon), len = 40 + R() * 160 * (1 + (y - horizon) / 500), x = ((R() * (W + 400) + t * (12 + R() * 14) + sx) % (W + 400)) - 200; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y); ctx.stroke(); }
}
function reflect(horizon, fn, a = .28) { ctx.save(); ctx.beginPath(); ctx.rect(-200, horizon, W + 400, H); ctx.clip(); ctx.translate(0, 2 * horizon); ctx.scale(1, -1); ctx.globalAlpha = a; ctx.filter = 'blur(3px)'; fn(); ctx.restore(); }
function haze(y, h, col, a) { const g = ctx.createLinearGradient(0, y - h, 0, y + h); g.addColorStop(0, `rgba(${col},0)`); g.addColorStop(.5, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`); ctx.fillStyle = g; ctx.fillRect(-200, y - h, W + 400, h * 2); }
function vignette(a = .7) { const g = ctx.createRadialGradient(W / 2, H * .45, 380, W / 2, H * .5, 1250); g.addColorStop(0, 'rgba(4,6,12,0)'); g.addColorStop(1, `rgba(4,6,12,${a})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const b = ctx.createLinearGradient(0, H * .7, 0, H); b.addColorStop(0, 'rgba(3,4,8,0)'); b.addColorStop(1, 'rgba(3,4,8,.75)'); ctx.fillStyle = b; ctx.fillRect(0, H * .7, W, H * .3); }
function moon(x, y, r) { glow(x, y, r * 6, '200,210,235', .22); ctx.fillStyle = '#e9e5d8'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(190,190,185,.35)'; ctx.beginPath(); ctx.arc(x - r * .3, y - r * .2, r * .22, 0, 7); ctx.arc(x + r * .25, y + r * .3, r * .15, 0, 7); ctx.fill(); }
function stars(t, a = 1) { for (const [x, y, r, ph] of STARS) { ctx.fillStyle = `rgba(230,235,245,${a * (.35 + .35 * Math.sin(t * 1.3 + ph))})`; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); } }

// ---------------------------------------------------------------- puppets (flat parts rotating at joints)
const SKIN = '#c4895c', SKIN_D = '#a8714a';
function headProfile(x, y, s, o) {               // facing right; o: { tilt, mouth, pale, hair:'short'|'long', eye }
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.tilt || 0); ctx.scale(s, s);
  const skin = o.pale ? '#b9c3c9' : SKIN;
  if (o.hair === 'long') { ctx.fillStyle = '#111317'; ctx.beginPath(); ctx.moveTo(-26, -20); ctx.quadraticCurveTo(-46, 40, -38 + (o.sway || 0), 150); ctx.lineTo(-6 + (o.sway || 0) * .6, 150); ctx.quadraticCurveTo(-14, 40, 0, 10); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle = skin; ctx.beginPath(); ctx.ellipse(0, 0, 27, 31, 0, 0, 7); ctx.fill();
  poly([[22, -4], [33, 7], [23, 12]], skin);                                            // nose
  ctx.fillStyle = o.pale ? '#9aa6ad' : SKIN_D; ctx.beginPath(); ctx.arc(-6, 4, 6, 0, 7); ctx.fill();   // ear
  ctx.fillStyle = '#16181d'; ctx.beginPath();                                        // hair cap
  if (o.hair === 'long') { ctx.moveTo(-28, 6); ctx.quadraticCurveTo(-30, -34, 4, -33); ctx.quadraticCurveTo(26, -31, 27, -10); ctx.quadraticCurveTo(8, -20, -10, -8); }
  else { ctx.moveTo(-28, 8); ctx.quadraticCurveTo(-31, -34, 6, -33); ctx.quadraticCurveTo(28, -30, 26, -12); ctx.lineTo(10, -16); ctx.quadraticCurveTo(-8, -14, -14, 8); }
  ctx.closePath(); ctx.fill();
  if (o.pale) { ctx.fillStyle = '#1a1d24'; ctx.beginPath(); ctx.ellipse(14, -3, 7, 8, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#e6f2f5'; ctx.beginPath(); ctx.arc(16, -3, 2.2, 0, 7); ctx.fill(); }
  else { ctx.fillStyle = '#f4efe6'; ctx.beginPath(); ctx.ellipse(14, -4, 6, o.eye ?? 4, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#1b1b1f'; ctx.beginPath(); ctx.arc(16, -4, 2.6, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#4a2224'; ctx.beginPath(); ctx.ellipse(18, 17, 5, 1.5 + (o.mouth || 0) * 6, 0, 0, 7); ctx.fill();
  ctx.restore();
}
// seated rower in profile, facing right; ph drives the stroke, k (0..1) blends from rowing to stopped
function rower(x, y, s, ph, k, look) {
  const st = Math.sin(ph) * (1 - k), lean = .12 * st - .05 * k;
  const sh = [x + Math.sin(lean) * 112 * s, y - Math.cos(lean) * 112 * s];
  const handFar = [sh[0] + (42 + 30 * st) * s, sh[1] + (38 - 6 * st) * s];
  // far arm (darker), behind
  const elF = [sh[0] + (8 + 22 * st) * s, sh[1] + 50 * s]; tube(sh[0], sh[1], elF[0], elF[1], 17 * s, '#24315f'); tube(elF[0], elF[1], handFar[0] - 6 * s, handFar[1] - 4 * s, 14 * s, SKIN_D);
  // oar: from hands back down into the water
  const oa = .95 - .35 * st; tube(handFar[0] + 30 * s, handFar[1] - 18 * s, handFar[0] - Math.cos(oa) * 330 * s, handFar[1] + Math.sin(oa) * 330 * s, 8 * s, '#6b4a30');
  ctx.save(); ctx.translate(handFar[0] - Math.cos(oa) * 330 * s, handFar[1] + Math.sin(oa) * 330 * s); ctx.rotate(-oa + Math.PI); ctx.fillStyle = '#6b4a30'; ctx.beginPath(); ctx.ellipse(-20 * s, 0, 34 * s, 10 * s, 0, 0, 7); ctx.fill(); ctx.restore();
  // torso
  ctx.save(); ctx.translate(x, y); ctx.rotate(lean); poly([[-24 * s, 0], [24 * s, 0], [27 * s, -112 * s], [-25 * s, -110 * s]], '#2e3f78');
  poly([[-25 * s, -110 * s], [27 * s, -112 * s], [10 * s, -60 * s]], '#34478a'); ctx.restore();
  headProfile(sh[0] + 4 * s, sh[1] - 38 * s, s, { tilt: lean * .6 + look, hair: 'short' });
  // near arm
  const elN = [sh[0] + (4 + 26 * st) * s, sh[1] + 54 * s]; tube(sh[0], sh[1] + 4 * s, elN[0], elN[1], 18 * s, '#33468a'); tube(elN[0], elN[1], handFar[0], handFar[1], 15 * s, SKIN);
  ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(handFar[0], handFar[1], 9 * s, 0, 7); ctx.fill();
}
function boat(x, y, s, bob, lamp) {
  ctx.save(); ctx.translate(x, y + bob); ctx.rotate(Math.sin(bob * .2) * .02); ctx.scale(s, s);
  if (lamp) { tube(150, -10, 150, -120, 5, '#4a3424'); tube(150, -120, 182, -120, 4, '#4a3424'); ctx.fillStyle = '#f6c36c'; ctx.fillRect(173, -112, 18, 26); glow(182 * s / s, -99, 160, '255,190,110', .55); }
  ctx.fillStyle = '#4b2f22'; ctx.beginPath(); ctx.moveTo(-200, -28); ctx.quadraticCurveTo(-170, 34, -60, 38); ctx.lineTo(80, 38); ctx.quadraticCurveTo(190, 30, 215, -36); ctx.quadraticCurveTo(10, -6, -200, -28); ctx.fill();
  ctx.fillStyle = '#3a2219'; ctx.beginPath(); ctx.moveTo(-178, 4); ctx.quadraticCurveTo(-140, 36, -60, 38); ctx.lineTo(80, 38); ctx.quadraticCurveTo(170, 32, 196, 0); ctx.quadraticCurveTo(10, 22, -178, 4); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-170, -8); ctx.quadraticCurveTo(10, 14, 200, -14); ctx.stroke();
  ctx.restore();
}
function rock(x, y, s, lit) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  poly([[-190, 0], [-150, -90], [-90, -140], [-20, -170], [40, -150], [110, -120], [160, -60], [200, 0]], '#141c2b');
  poly([[-150, -90], [-90, -140], [-20, -170], [40, -150], [-10, -130], [-80, -110]], lit);
  poly([[60, -120], [110, -120], [150, -66], [90, -80]], '#1b2436');
  ctx.restore();
}
function siren(x, y, s, t, sing) {                 // seated on the rock, facing left (mirrored), tail curling down
  ctx.save(); ctx.translate(x, y); ctx.scale(-s, s);
  const sw = Math.sin(t * 1.3) * 6;
  ctx.fillStyle = '#2f6f73'; ctx.beginPath(); ctx.moveTo(-26, 0); ctx.quadraticCurveTo(-10, 70, 50, 96); ctx.quadraticCurveTo(110, 116, 132 + sw * .4, 92); ctx.lineTo(118, 80); ctx.quadraticCurveTo(70, 88, 34, 52); ctx.quadraticCurveTo(26, 22, 26, 0); ctx.closePath(); ctx.fill();
  poly([[124 + sw * .4, 86], [168 + sw, 60], [158 + sw, 104], [176 + sw, 128]], '#3f8d8f');
  ctx.strokeStyle = 'rgba(160,220,215,.25)'; ctx.lineWidth = 3; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(10 + i * 20, 46 + i * 12, 12, .3, 2.2); ctx.stroke(); }
  poly([[-24, 4], [24, 4], [20, -98], [-22, -96]], '#b9c3c9');
  tube(-14, -86, -40, -30, 15, '#aab4ba'); tube(-40, -30, -48, 6, 13, '#aab4ba');
  tube(14, -86, 30, -40, 15, '#b9c3c9'); tube(30, -40, 10, -14, 13, '#b9c3c9');
  headProfile(4, -126, 1, { pale: true, hair: 'long', mouth: sing, sway: sw, tilt: -.12 + Math.sin(t * .9) * .03 });
  ctx.restore();
}

// ---------------------------------------------------------------- scenes
const HOR = 1080;
function scene1(t) {                    // wide night sea, sailor rows toward a far rock; slow pan right
  const pan = -40 * io(seg(t, 0, 3.8));
  sky('#08101f', '#13203a', '#22314f', HOR); stars(t);
  ctx.save(); ctx.translate(pan * .2, 0); moon(780, 380, 44); ctx.restore();
  const far = () => { ctx.save(); ctx.translate(pan * .4, 0); rock(860, HOR, .55, '#25314a'); ctx.restore(); };
  far(); haze(HOR, 70, '90,120,165', .22);
  water(HOR, '#15233a', '#05080f', t, pan);
  const bob = Math.sin(t * 2.1) * 5, bx = 320 + t * 28 + pan;
  reflect(HOR, () => { ctx.save(); ctx.translate(pan * .2, 0); moon(780, 380, 44); ctx.restore(); far(); });
  ctx.save(); ctx.translate(0, 1260 + bob); ctx.globalAlpha = .3; ctx.scale(1, -.6); ctx.translate(0, -1260 - bob); ctx.filter = 'blur(3px)'; boat(bx, 1260, .9, 0, true); ctx.restore();
  rower(bx - 20, 1238 + bob, .9, t * 2.6, 0, 0); boat(bx, 1260, .9, bob, true);
  glow(bx + 165, 1290 + bob, 120, '255,180,100', .12);
}
function scene2(t) {                    // medium: the siren on her rock sings; the sailor stops rowing and looks
  const lt = t - 3.4, push = 1 + .05 * io(seg(lt, 0, 3.8));
  ctx.save(); ctx.translate(W / 2, 1100); ctx.scale(push, push); ctx.translate(-W / 2, -1100);
  sky('#0a1324', '#172540', '#2a3a5c', HOR); stars(t, .8); moon(220, 420, 40);
  const R = () => { rock(740, HOR + 40, 1.15, '#2e3c58'); siren(760, HOR - 150, 1.0, t, .5 + .5 * Math.sin(t * 5)); };
  haze(HOR, 60, '110,140,180', .18);
  water(HOR, '#16253d', '#05080f', t);
  reflect(HOR, () => { moon(220, 420, 40); R(); }, .25);
  R(); glow(700, HOR - 250, 300, '170,210,235', .16 + .05 * Math.sin(t * 2));
  // faint song: soft rings drifting from her mouth toward the boat
  for (let i = 0; i < 4; i++) { const c = ((t * .45 + i / 4) % 1); ctx.strokeStyle = `rgba(200,230,240,${.22 * Math.sin(c * Math.PI)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(700 - c * 340, HOR - 270 + c * 90, 20 + c * 50, 2.2, 4.1); ctx.stroke(); }
  const k = sm(seg(lt, .3, 1.2)), bob = Math.sin(t * 2.1) * 5;
  rower(220, 1300 + bob, 1.05, (3.4 + lt * (1 - k)) * 2.6, k, -.18 * k); boat(240, 1322, 1.05, bob, true);
  ctx.restore();
}
function scene3(t) {                    // close: under the boat, a pale face rises and an arm stretches toward the hull
  const lt = t - 7.0, WL = 760;
  const g = ctx.createLinearGradient(0, 0, 0, WL); g.addColorStop(0, '#0b1424'); g.addColorStop(1, '#1b2a44'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, WL);
  const u = ctx.createLinearGradient(0, WL, 0, H); u.addColorStop(0, '#123044'); u.addColorStop(.5, '#0a1a28'); u.addColorStop(1, '#03070c'); ctx.fillStyle = u; ctx.fillRect(0, WL, W, H - WL);
  // lantern light falling into the water
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; const b = ctx.createLinearGradient(0, WL, 0, WL + 900); b.addColorStop(0, 'rgba(255,200,130,.22)'); b.addColorStop(1, 'rgba(255,200,130,0)'); ctx.fillStyle = b; ctx.beginPath(); ctx.moveTo(560, WL); ctx.lineTo(760, WL); ctx.lineTo(900, WL + 900); ctx.lineTo(420, WL + 900); ctx.fill(); ctx.restore();
  // the face rising from below, hair spreading
  const rise = io(seg(lt, 0, 2.6)), fy = lerp(1650, 1240, rise), fa = clamp(lt / 1.2);
  ctx.save(); ctx.globalAlpha = fa * .9;
  ctx.fillStyle = '#0d1116'; for (let i = 0; i < 9; i++) { const a = -Math.PI * .9 + i * .23, sw = Math.sin(t * 1.4 + i) * 10; ctx.beginPath(); ctx.moveTo(540, fy - 40); ctx.quadraticCurveTo(540 + Math.cos(a) * 160 + sw, fy + Math.sin(a) * 120, 540 + Math.cos(a) * 300 + sw * 2, fy + Math.sin(a) * 260 + 120); ctx.lineWidth = 34; ctx.strokeStyle = '#0d1116'; ctx.stroke(); }
  ctx.fillStyle = '#9fb0b8'; ctx.beginPath(); ctx.ellipse(540, fy, 92, 118, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#16191f'; ctx.beginPath(); ctx.ellipse(506, fy - 14, 20, 15, 0, 0, 7); ctx.ellipse(574, fy - 14, 20, 15, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#e8f4f6'; ctx.beginPath(); ctx.arc(510, fy - 16, 4, 0, 7); ctx.arc(578, fy - 16, 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#3a2a30'; ctx.beginPath(); ctx.ellipse(540, fy + 52, 16, 4 + 3 * Math.sin(t * 4), 0, 0, 7); ctx.fill();
  ctx.restore();
  // her arm stretches up, longer and longer, toward the hull
  const reach = io(seg(lt, .9, 2.0)), hx = lerp(640, 690, reach), hy = lerp(fy + 40, WL - 70, reach);
  ctx.save(); ctx.globalAlpha = fa; tube(610, fy + 60, hx, hy, 22, '#93a4ac'); ctx.fillStyle = '#a8b8c0'; ctx.beginPath(); ctx.arc(hx, hy, 15, 0, 7); ctx.fill();
  for (let i = -1; i <= 1; i++) tube(hx + i * 9, hy - 6, hx + i * 13, hy - 24, 7, '#a8b8c0'); ctx.restore();
  // water surface over everything below it: slight veil, ripple lines
  ctx.fillStyle = 'rgba(20,48,66,.35)'; ctx.fillRect(0, WL, W, H - WL);
  ctx.fillStyle = 'rgba(190,215,235,.35)'; ctx.fillRect(0, WL - 2, W, 4);
  for (let i = 0; i < 6; i++) { const c = (t * .6 + i / 6) % 1; ctx.strokeStyle = `rgba(190,215,235,${.25 * (1 - c)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(hx, WL, 40 + c * 220, 6 + c * 12, 0, 0, 7); ctx.stroke(); }
  // the boat's hull from the side, close, lamp above
  const bob = Math.sin(t * 2.1) * 6;
  ctx.save(); ctx.translate(0, bob);
  ctx.fillStyle = '#4b2f22'; ctx.beginPath(); ctx.moveTo(-60, 560); ctx.lineTo(1140, 560); ctx.lineTo(1140, 700); ctx.quadraticCurveTo(540, 800, -60, 700); ctx.fill();
  ctx.fillStyle = '#3a2219'; ctx.beginPath(); ctx.moveTo(-60, 650); ctx.quadraticCurveTo(540, 740, 1140, 650); ctx.lineTo(1140, 700); ctx.quadraticCurveTo(540, 800, -60, 700); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 3; for (const y of [600, 630]) { ctx.beginPath(); ctx.moveTo(-60, y); ctx.quadraticCurveTo(540, y + 30, 1140, y); ctx.stroke(); }
  tube(820, 560, 820, 360, 8, '#4a3424'); ctx.fillStyle = '#f6c36c'; ctx.fillRect(800, 330, 40, 56); glow(820, 358, 300, '255,190,110', .5);
  ctx.restore();
  ctx.fillStyle = `rgba(0,0,0,${sm(seg(t, 9.45, .55))})`; ctx.fillRect(0, 0, W, H);   // fade out
}

// ---------------------------------------------------------------- captions and title
const FONT = 'Poppins';
const CAP = [
  { s: .25, e: 1.55, y: 1520, w: [['Sailors', .25], ['say:', .8]] },
  { s: 1.6, e: 2.6, y: 1520, w: [['if', 1.6], ['you', 1.78], ['hear', 1.95], ['singing', 2.2]] },
  { s: 2.6, e: 3.4, y: 1520, w: [['at', 2.6], ['sea,', 2.85]] },
  { s: 3.6, e: 4.4, y: 370, w: [["don't", 3.6], ['look', 3.95]] },
  { s: 4.4, e: 5.4, y: 370, w: [['for', 4.4], ['the', 4.6], ['voice.', 4.8]] },
  { s: 5.6, e: 6.85, y: 370, w: [["She's", 5.6], ['already', 5.95]] },
  { s: 7.15, e: 8.45, y: 370, w: [['looking', 7.15], ['at', 7.6], ['you.', 7.8]] },
  { s: 8.65, e: 9.5, y: 370, w: [['Row.', 8.65]] }];
function captions(t) {
  for (const c of CAP) {
    const a = Math.min(seg(t, c.s, .15), 1 - seg(t, c.e - .15, .15)); if (a <= 0) continue;
    ctx.save(); ctx.globalAlpha = a; ctx.font = `600 64px ${FONT}`; ctx.textBaseline = 'middle';
    const gap = 18, ws = c.w.map(([w]) => ctx.measureText(w).width), tot = ws.reduce((x, y) => x + y, 0) + gap * (ws.length - 1); let x = W / 2 - tot / 2;
    let act = 0; c.w.forEach(([, s], i) => { if (t >= s) act = i; });
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 2;
    c.w.forEach(([w], i) => { ctx.fillStyle = i === act ? '#f2a65a' : '#ffffff'; ctx.fillText(w, x, c.y); x += ws[i] + gap; });
    ctx.restore();
  }
}
function title(t) {
  const a = Math.min(seg(t, .3, .8), 1 - seg(t, 2.7, .7)); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a * .92; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#e9dcbc';
  ctx.font = `600 26px ${FONT}`; ctx.letterSpacing = '9px'; ctx.fillText('FOLK HORROR TALES', W / 2, 560);
  ctx.fillRect(W / 2 - 330, 559, 110, 1.5); ctx.fillRect(W / 2 + 220, 559, 110, 1.5);
  ctx.letterSpacing = '10px'; ctx.font = `400 128px "Liberation Serif", serif`; ctx.fillText('SIRENS', W / 2 + 5, 680);
  ctx.letterSpacing = '0px'; ctx.font = `italic 400 40px "Liberation Serif", serif`; ctx.fillText('– Tale No. 4 –', W / 2, 775);
  ctx.restore();
}

window.DUR = 10; window.TEXTS = () => [];
window.render = t => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.clearRect(0, 0, W, H);
  if (t < 3.4) scene1(t);
  else if (t < 3.95) { scene1(t); ctx.save(); ctx.globalAlpha = sm(seg(t, 3.4, .55)); scene2(t); ctx.restore(); }   // dissolve
  else if (t < 7.0) scene2(t);
  else if (t < 7.25) { scene2(t); ctx.save(); ctx.globalAlpha = sm(seg(t, 7.0, .25)); scene3(t); ctx.restore(); }
  else scene3(t);
  ctx.save(); vignette(t >= 7 ? .8 : .65); ctx.restore();
  title(t); captions(t);
};
Promise.all(['600'].map(w => new FontFace('Poppins', `url(fonts/poppins-latin-${w}-normal.woff2)`, { weight: w }).load().then(f => document.fonts.add(f)))).then(() => { window.render(0); window.READY = true; });
